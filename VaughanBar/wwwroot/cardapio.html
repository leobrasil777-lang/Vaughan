<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaughan Bar - Cardápio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="cardapio-page">

  <div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <main class="main-content cardapio-content">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 page-title cardapio-page-header">
        <h1 class="mb-0">Cardápio</h1>
        <button id="btn-novo-produto" class="btn vb-btn-dark">+ Novo produto</button>
      </div>

      <div id="msg-area"></div>

      <div class="vb-panel cardapio-table-panel">
        <div class="table-responsive">
          <table class="table vb-table cardapio-table mb-0">
            <thead>
              <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th class="text-center">Status</th>
                <th class="text-end">Ações</th>
              </tr>
            </thead>
            <tbody id="tbody-produtos">
              <tr><td colspan="6" class="text-center py-4 table-state">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: criar/editar produto -->
  <div class="modal fade" id="modalProduto" tabindex="-1" aria-labelledby="tituloModalProduto" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalProduto">Novo produto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="produto-id">
          <div class="mb-3">
            <label for="produto-nome" class="form-label">Nome</label>
            <input type="text" id="produto-nome" class="form-control">
          </div>
          <div class="mb-3">
            <label for="produto-categoria" class="form-label">Categoria</label>
            <input type="text" id="produto-categoria" class="form-control" placeholder="Ex: Bebidas, Petiscos...">
          </div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label for="produto-preco" class="form-label">Preço (R$)</label>
              <input type="number" id="produto-preco" class="form-control" step="0.01" min="0.01">
            </div>
            <div class="col-sm-6" id="campo-estoque-inicial">
              <label for="produto-estoque" class="form-label">Estoque inicial</label>
              <input type="number" id="produto-estoque" class="form-control" min="0" value="0">
            </div>
          </div>
          <div class="mt-3">
            <label for="produto-estoque-minimo" class="form-label">Estoque mínimo</label>
            <input type="number" id="produto-estoque-minimo" class="form-control" min="0" value="5">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn vb-btn-outline" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn-salvar-produto" class="btn vb-btn-dark">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/cardapio.js"></script>
</body>
</html>
